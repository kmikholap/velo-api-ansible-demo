---
- name: Provision VeloCloud Edges
  hosts: vco
  connection: local
  gather_facts: false

  tasks:
    - name: Gather VeloCloud profile facts
      arista.velocloud.vco_facts:
        orchestrator_url: "{{ vco_orchestrator_url }}"
        api_token: "{{ vco_api_token }}"
        enterprise_id: "{{ vco_enterprise_id }}"
        verify_ssl: "{{ vco_verify_ssl | default(true) }}"
        gather:
          - profiles

    - name: Display available profiles
      ansible.builtin.debug:
        var: ansible_facts.velocloud.profiles

    - name: Provision each edge
      arista.velocloud.vco_edge_provision:
        orchestrator_url: "{{ vco_orchestrator_url }}"
        api_token: "{{ vco_api_token }}"
        enterprise_id: "{{ vco_enterprise_id }}"
        verify_ssl: "{{ vco_verify_ssl | default(true) }}"
        name: "{{ item.name }}"
        model_number: "{{ item.model_number | default(vco_default_model) }}"
        configuration_id: >-
          {{ (ansible_facts.velocloud.profiles |
              selectattr('name', 'equalto',
                item.profile_name | default(vco_default_profile_name)) |
              first).id }}
        description: "{{ item.description | default(omit) }}"
        site: "{{ item.site | default(omit) }}"
        wan_interface: "{{ item.wan_interface | default('GE3') }}"
        wan_ip: "{{ item.wan_ip | default(omit) }}"
        wan_netmask: "{{ item.wan_netmask | default(omit) }}"
        wan_gateway: "{{ item.wan_gateway | default(omit) }}"
        send_activation_email: "{{ item.send_activation_email | default(true) }}"
        license_alias: "{{ item.license_alias | default(omit) }}"
        ha_enabled: "{{ item.ha_enabled | default(omit) }}"
      loop: "{{ edges_to_provision }}"
      loop_control:
        label: "{{ item.name }}"
      register: provision_results

    - name: Show provisioning results
      ansible.builtin.debug:
        msg: |
          Edge: {{ item.item.name }}
          Edge ID: {{ item.edge_id }}
          Activation Key: {{ item.activation_key }}
          WAN Configured: {{ item.wan_configured }}
          Email Sent: {{ item.email_sent }}
      loop: "{{ provision_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
